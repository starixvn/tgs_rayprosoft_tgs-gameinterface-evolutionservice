syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "phoenix/protobuf/decimal.proto";

option csharp_namespace = "Tgs.GameInterface.EvolutionService.Protos";

package GameInterfaceEvoService;

service GameInterfaceEvoService {
	rpc GetLiveDealerGameUrl (GetLiveDealerGameUrlRequest) returns (GameUrlReply);
	rpc GetSlotGameUrl (GetSlotGameUrlRequest) returns (GameUrlReply);
	rpc FundIn (FundInRequest) returns (FundInReply);
	rpc FundOut (FundOutRequest) returns (FundOutReply);
	rpc GetBalance (GetBalanceRequest) returns (GetBalanceReply);
	rpc GetPlayerInfo (GetPlayerInfoRequest) returns (GetPlayerInfoReply);
	rpc GetTransactionInfo (GetTransactionInfoRequest) returns (GetTransactionInfoReply);
	rpc KickPlayer (KickPlayerRequest) returns (KickPlayerReply);
	rpc GetGameHistories (GetGameHistoriesRequest) returns (GetGameHistoriesReply);
    rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

message GetLiveDealerGameUrlRequest {
	string ua2_authentication_url = 1;
	string brand_code = 2;
	string player_code = 3;
	int32 platform_type= 4;
	string ip_address= 5;
	string encrypted_token = 6;
	string external_culture_code = 7;
	string external_currency_code = 8;
}

message GetSlotGameUrlRequest {
	string ua2_authentication_url = 1;
	string brand_code = 2;
	string player_code = 3;
	int32 platform_type= 4;
	string ip_address= 5;
	string encrypted_token = 6;
	string external_culture_code = 7;
	string external_currency_code = 8;
	string external_game_id = 9;
}

message GameUrlReply {
	string entry = 1;
	string entry_embedded = 2;
	repeated Error errors = 3;
}

message Error
{
	string code = 1;
	string message = 2;
}

message FundInRequest {
	string api_url = 1;
	string agent_id = 2;
	string player_code = 3;
	string transaction_id = 4;
	phoenix.protobuf.DecimalValue amount = 5;
}

message FundInReply {
	bool result = 1;
	string evo_transaction_id = 2;
	string transaction_id = 3;
	string player_code = 4;
	string uid = 5;
	phoenix.protobuf.DecimalValue balance = 6;
	string error_message = 7;
}

message FundOutRequest {
	string api_url = 1;
	string agent_id = 2;
	string player_code = 3;
	string transaction_id = 4;
	phoenix.protobuf.DecimalValue amount = 5;
}

message FundOutReply {
	bool Result = 1;
	string evo_transaction_id = 2;
	string transaction_id = 3;
	string player_code = 4;
	string uid = 5;
	phoenix.protobuf.DecimalValue balance = 6;
	string error_message = 7;
}

message GetBalanceRequest {
	string api_url = 1;
	string agent_id = 2;
	string player_code = 3;
}

message GetBalanceReply {
	bool result = 1;
	string player_code = 2;
	string uid = 3;
	phoenix.protobuf.DecimalValue balance = 4;
	bool is_player_exist = 5;
	string error_message = 6;
}

message GetPlayerInfoRequest {
	string api_url = 1;
	string agent_id = 2;
	string player_code = 3;
}

message GetPlayerInfoReply {
	string email_address = 1;
	string firstname = 2;
	string lastname = 3;
	string screen_name = 4;
	string country_code = 5;
	string player_code = 6;
	string uid = 7;
	string error_message = 8;
}

message GetTransactionInfoRequest {
	string api_url = 1;
	string agent_id = 2;
	string player_code = 3;
	string transaction_id = 4;
}

message GetTransactionInfoReply {
	bool result = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	string transaction_id = 3;
	string evo_transaction_id = 4;
	google.protobuf.Timestamp created_on = 5;
	google.protobuf.Timestamp created_on_iso = 6;
	string evo_uid = 7;
	string player_code = 8;
	string c_cid = 9;
	phoenix.protobuf.DecimalValue amount = 10;
	string error_message = 11;
}

message KickPlayerRequest {
	string api_url = 1;
	string casino_id = 2;
	string api_token = 3;
	string uuid = 4;
	string player_code = 5;
}

message KickPlayerReply {
	bool result = 1;
}

message GetGameHistoriesRequest {
	string api_url = 1;
	string casino_id = 2;
	string game_history_api_token = 3;
	google.protobuf.Timestamp start_date = 4; 
	google.protobuf.Timestamp end_date = 5; 
}

message GetGameHistoriesReply {
	repeated GameHistoryRecord records = 1;
}

message GameHistoryRecord {
	string player_code = 1;
	string external_round_id = 2;
	string ExternalGameId = 3;
	google.protobuf.Timestamp ExternalCreatedOn = 4;
	google.protobuf.Timestamp ExternalClosedOn = 5;
	phoenix.protobuf.DecimalValue BetAmount = 6;
	phoenix.protobuf.DecimalValue ValidBetAmount = 7;
	phoenix.protobuf.DecimalValue SettleAmount = 8;
	string AdditionalData = 9;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

message CheckingServiceReply{
    string machine_name = 1;
}